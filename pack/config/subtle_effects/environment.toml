# Don't change this! Version used to track needed updates.
version = 1
biomeColorRain = true

[biomes]
# Fallow : pollen et spores aussi dans les prairies, vergers et marais à champignons de Regions Unexplored.
mushroomSporeDensity = 0.5
mushroomSporeBiomes = [
    "minecraft:mushroom_fields",
    "regions_unexplored:fungal_fen"
]
pollenDensity = 0.75
pollenBiomes = [
    "minecraft:flower_forest",
    "minecraft:sunflower_plains",
    "minecraft:meadow",
    "minecraft:cherry_grove",
    "regions_unexplored:flower_fields",
    "regions_unexplored:poppy_fields",
    "regions_unexplored:prairie",
    "regions_unexplored:clover_plains",
    "regions_unexplored:highland_fields",
    "regions_unexplored:magnolia_woodland",
    "regions_unexplored:orchard",
    "regions_unexplored:wisteria_grove",
    "regions_unexplored:grassland"
]
sculkDustDensity = 0.25
sculkDustBiomes = [
    "minecraft:deep_dark"
]

[geysers]
useUpdatedSmoke = false
flameGeyserSpawnChance = 5
flameGeyserSpawnableBlocks = [
    "minecraft:netherrack",
    "minecraft:blackstone",
    "minecraft:soul_soil"
]
flameGeyserSoundVolume = 0.5
flameGeyserActiveTime = 300
flameGeyserInactiveTime = 500
smokeGeyserSpawnChance = 5
smokeGeyserSpawnableBlocks = [
    "minecraft:netherrack",
    "minecraft:blackstone",
    "minecraft:soul_soil"
]
smokeGeyserSoundVolume = 0.2
smokeGeyserActiveTime = 300
smokeGeyserInactiveTime = 500
bubbleGeyserSpawnChance = 5
bubbleGeyserSpawnableBlocks = [
    "minecraft:sand",
    "minecraft:red_sand",
    "minecraft:gravel",
    "minecraft:dirt",
    "minecraft:clay"
]
bubbleGeyserSoundVolume = 0.5
bubbleGeyserActiveTime = 300
bubbleGeyserInactiveTime = 500

[fireflies]
# Fallow : les lucioles du pack sont celles de Naturalist, de vraies bêtes ; celles-ci n'étaient que des particules.
firefliesEnabled = false
dimensionBlocklist = [
    "twilightforest:twilight_forest_type"
]
biomesBlocklist = [  ]
biomesAllowlist = [
    "minecraft:lush_caves"
]
spawnableBlocks = [
    "minecraft:short_grass",
    "minecraft:tall_grass",
    "minecraft:poppy",
    "minecraft:dandelion",
    "minecraft:peony",
    "minecraft:blue_orchid",
    "minecraft:allium",
    "minecraft:azure_bluet",
    "minecraft:orange_tulip",
    "minecraft:pink_tulip",
    "minecraft:red_tulip",
    "minecraft:white_tulip",
    "minecraft:oxeye_daisy",
    "minecraft:cornflower",
    "minecraft:lily_of_the_valley",
    "minecraft:sunflower",
    "minecraft:lilac",
    "minecraft:rose_bush",
    "minecraft:pink_petals",
    "minecraft:flowering_azalea"
]
defaultDensity = 3
ignoredSeasons = "DEFAULT"
fireflyType = "ORIGINAL"
fireflySoundVolume = 1.0
onlyAllowInHabitatBiomes = false
habitatBiomes = [
    "minecraft:swamp",
    "minecraft:mangrove_swamp"
]
habitatBiomeDensity = 3

[waterfalls]
waterfallsEnabled = true
smallWaterfallsEnabled = true
waterfallUpdateFrequency = 6
randomizeWaterfallParticleRotation = false
mediumWaterfallParticleDensity = 1.0
mediumWaterfallHeightThreshold = 6
forceSpawnMediumWaterfallParticles = true
largeWaterfallsEnabled = true
largeWaterfallParticleDensity = 1.0
largeWaterfallHeightThreshold = 10
forceSpawnLargeWaterfallParticles = true