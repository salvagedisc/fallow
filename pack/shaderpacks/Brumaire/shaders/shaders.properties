# Brumaire : réglages d'Iris.

# L'occlusion du jeu arrive à part (alpha des sommets) et le jeu n'assombrit plus lui-même les faces.
separateAo=true
oldLighting=false
# Le sol sèche lentement après la pluie (demi-vie d'une minute) : le séchage par plaques a le temps de se voir.
drynessHalfLife=1200
underwaterOverlay=false
vignette=false
rain.depth=false
beacon.beam.depth=true
dhShadow.enabled=false
shadowTranslucent=true

# Fonctions d'Iris demandées : images et programmes de calcul (la table du ciel).
iris.features.required = CUSTOM_IMAGES COMPUTE_SHADERS

# La table du ciel (prepare.csh), relue par tous les programmes sous le nom skyTex ; une case de sa dernière ligne
# garde la teinte de la lune, écrite par gbuffers_skytextured.vsh.
image.skyImg = skyTex RGBA RGBA16F HALF_FLOAT false false 192 109

# La lumière colorée (lib/voxel.glsl) : les blocs autour de la caméra, rangés par la passe d'ombre, et la lumière
# répandue de proche en proche par shadowcomp, une image sur deux dans A, l'autre dans B.
image.voxelImg = voxelTex RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.lightImgA = lightTexA RGBA RGBA16F HALF_FLOAT false false 128 64 128
image.lightImgB = lightTexB RGBA RGBA16F HALF_FLOAT false false 128 64 128
# Les reflets hors écran (lib/voxtrace.glsl) : la couleur moyenne du dessus et des côtés de chaque bloc du volume.
image.voxTopImg = voxTopTex RED_INTEGER R32UI UNSIGNED_INT false false 128 64 128
image.voxSideImg = voxSideTex RED_INTEGER R32UI UNSIGNED_INT false false 128 64 128
program.shadowcomp.enabled = COLORED_LIGHT
# L'abri de la pluie dessinée par le shader (shadowcomp1), tiré du même volume.
image.shelterImg = shelterTex RED R16F HALF_FLOAT false false 128 128
program.shadowcomp1.enabled = SHADER_RAIN
# Le feuillage au-dessus de chaque colonne, pour les gouttes des arbres et les feuilles sur l'eau (shadowcomp2).
image.canopyImg = canopyTex RGBA RGBA16F HALF_FLOAT false false 128 128
program.shadowcomp2.enabled = CANOPY_DRIPS || FLOATING_LEAVES
# Les rives : l'eau la plus proche de chaque colonne, pour le sol mouillé au bord de l'eau (shadowcomp3).
image.shoreImg = shoreTex RGBA RGBA16F HALF_FLOAT false false 128 128
program.shadowcomp3.enabled = SHORE_WET
# Les touffes d'herbe : le terrain découpé passe par un shader de géométrie (bushy.gsh) ; sans lui, il retombe sur
# gbuffers_terrain et ne paie rien.
program.gbuffers_terrain_cutout.enabled = GRASS_TUFTS

# Les traces de pas (lib/tracks.glsl) : la carte des empreintes, et où chaque être proche a posé le dernier pied.
image.trackImg = trackTex RGBA RGBA16F HALF_FLOAT false false 1024 1024
image.trackStateImg = trackStateTex RGBA RGBA32F FLOAT false false 4 1
program.prepare1.enabled = TRACKS
# Les rides de ce qui passe sur l'eau (lib/wakes.glsl) : deux demi-pas par image, de A vers B puis de B vers A.
image.wakeImgA = wakeTexA RGBA RGBA16F HALF_FLOAT false false 512 512
image.wakeImgB = wakeTexB RGBA RGBA16F HALF_FLOAT false false 512 512
program.prepare2.enabled = WATER_WAKES
program.prepare3.enabled = WATER_WAKES
# L'anticrénelage temporel (program/taa.fsh), entre l'étalonnage et le SMAA.
program.composite3.enabled = TAA
# Le flou de mouvement (program/motion.fsh), après l'anticrénelage temporel : l'historique reste net.
program.composite4.enabled = MOTION_BLUR
# Les passes coupées quand leur réglage est à 0 : les nuages et la brume proche (composite), l'occlusion et le rebond (deferred), les deux
# premières passes du SMAA (composite5 et 6). Leurs formats sont déclarés dans des passes toujours actives.
program.composite.enabled = CLOUD_STEPS || FOG_STEPS
program.deferred.enabled = AO_SAMPLES || SSGI
program.composite5.enabled = SMAA
program.composite6.enabled = SMAA

# Les ombres lointaines (lib/farshadow.glsl) : la plus haute surface vue, par colonne de deux blocs, gardée d'une
# image à l'autre.
image.farHeightImg = farHeightTex RED_INTEGER R32UI UNSIGNED_INT false false 2048 2048

# L'œil et l'objectif (lens.csh, avant l'étalonnage) : la clarté à laquelle l'œil s'est habitué, et la distance du point.
image.lensImg = lensTex RGBA RGBA16F HALF_FLOAT false false 1 1

# Le bruit des nuages (setup.csh), en trois dimensions, relu sous le nom cloudNoiseTex.
image.cloudNoiseImg = cloudNoiseTex RG RG8 UNSIGNED_BYTE false false 64 64 64

# L'air du biome où se tient le joueur, lissé sur une dizaine de secondes.
uniform.float.airHumid = smooth(clamp(rainfall, 0.0, 1.0), 8.0, 8.0)
uniform.float.airHeat = smooth(clamp(temperature, -0.5, 2.0), 8.0, 8.0)
# Il pleut là où se tient le joueur (ni neige ni désert), lissé sur quelques secondes : sol mouillé, rideaux de pluie.
uniform.float.rainHere = smooth(if(biome_precipitation == 1, 1.0, 0.0), 4.0, 4.0)
# Il neige là où se tient le joueur : neige sur les arbres et les rebords.
uniform.float.snowHere = smooth(if(biome_precipitation == 2, 1.0, 0.0), 10.0, 10.0)
# La neige qui tombe s'accumule : monte en quelques minutes de chute, retombe en une vingtaine après (lib/cover.glsl).
uniform.float.snowStorm = smooth(if(biome_precipitation == 2, rainStrength, 0.0), 240.0, 1500.0)
# L'objectif se mouille sous la pluie à ciel ouvert, en quelques secondes, et sèche en une vingtaine à l'abri.
uniform.float.lensWet = smooth(if(isEyeInWater == 0 && eyeBrightnessSmooth.y >= 200, rainStrength * rainHere, 0.0), 3.0, 20.0)
# En sortant de l'eau, l'objectif ruisselle quelques secondes.
uniform.float.lensDive = smooth(if(isEyeInWater == 1, 1.0, 0.0), 0.05, 6.0)
# Sous la neige à ciel ouvert, des flocons se posent sur l'objectif ; à l'abri, ils cessent de s'y poser.
uniform.float.lensSnow = smooth(if(isEyeInWater == 0 && eyeBrightnessSmooth.y >= 200, rainStrength * snowHere, 0.0), 3.0, 12.0)
# Les êtres trempés par la pluie (solid.fsh) ; le joueur qui sort de l'eau ruisselle une demi-minute.
uniform.float.rainSoak = smooth(rainStrength * rainHere, 6.0, 40.0)
uniform.float.swimSoak = smooth(if(isEyeInWater == 1, 1.0, 0.0), 0.2, 30.0)
uniform.float.snowSoak = smooth(rainStrength * snowHere, 60.0, 20.0)

# Les tables de l'anticrénelage SMAA (licence MIT, textures/SMAA-LICENSE.txt), relues par composite6.
customTexture.smaaArea = textures/smaa_area.png
customTexture.smaaSearch = textures/smaa_search.png

# L'occlusion d'écran se calcule sur un demi-écran.
scale.deferred = 0.5
# Les nuages aussi.
scale.composite = 0.5
# La carte d'ombre garde telle quelle la teinte des vitraux (shadowcolor1).
blend.shadow = off
# La couche des surfaces (normale, part de lumière indirecte) ne se mélange jamais.
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_entities.colortex1 = off
# La couleur propre des surfaces (relue pour le rebond de la lumière) non plus.
blend.gbuffers_terrain.colortex4 = off
blend.gbuffers_block.colortex4 = off
blend.gbuffers_entities.colortex4 = off
blend.clrwl_gbuffers.colortex1 = off
blend.gbuffers_textured.colortex1 = off
blend.gbuffers_textured_lit.colortex1 = off
blend.clrwl_gbuffers.colortex4 = off
# deferred1 copie la scène opaque dans colortex6 : l'eau y lit ce qu'elle laisse voir et ce qu'elle reflète.

# Profils : du plus léger au plus beau.
